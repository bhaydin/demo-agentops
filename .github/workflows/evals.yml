# Phase 5 quality gate. Runs the golden set (tests/Swankers.Evals) against the Coach for each
# prompt version with the real model, one job per version, so a run shows v1 green and v2 red
# side by side. With `promote: true` a green version is deployed as a new hosted agent version
# and routed to, after approval in the `foundry` environment. Auth is GitHub OIDC (no stored
# secrets, infra/ci-identity.ps1): eval jobs run pull-request code as swankers-ci-evals, whose
# roles are Foundry User on the separate `swankers-evals` project and Cognitive Services OpenAI
# User on the account (the cloud graders' model calls; no agent actions), so it can call models
# and run cloud evaluations but cannot touch the coach project's hosted agent; only the promote
# job, behind the environment's required review, logs in as swankers-ci-deploy.
name: evals

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Prompt versions to evaluate, comma-separated"
        default: "v1,v2"
      promote:
        description: "Deploy promote_version as a hosted agent version and route to it if its evals passed"
        type: boolean
        default: false
      promote_version:
        description: "Version to promote when promote is true"
        default: "v1"
  pull_request:
    paths:
      - "src/Swankers.Coach/prompts/**"
      - "knowledge/**"
      - "tests/Swankers.Evals/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          RAW: ${{ github.event.inputs.versions || 'v1,v2' }}
        run: echo "matrix=$(echo "$RAW" | jq -Rc 'split(",") | map(gsub("\\s"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  evals:
    needs: versions
    name: evals (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the trailing comment.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (SDK from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Azure login (OIDC, evals identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The identity that runs (pull-request) code here must not be able to create or route
      # hosted agent versions in the coach project. A create with an empty body answers 403
      # without access and 400 (validation) with it; anything but 403 fails the job.
      - name: Verify the evals identity cannot write agents in the coach project
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          token=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$FOUNDRY_PROJECT_ENDPOINT/agents?api-version=v1" \
            -H "Authorization: Bearer $token" -H "x-ms-agent-name: permission-probe" -H "Content-Type: application/json" -d '{}')
          echo "agent create probe returned HTTP $code"
          test "$code" = "403" || { echo "::error::the evals identity must not have agent write access (expected 403)"; exit 1; }

      - name: Restore (locked)
        run: dotnet restore SwankersCoach.slnx --locked-mode

      - name: Build
        run: dotnet build SwankersCoach.slnx --no-restore -c Release

      # The harness runs the Coach in-process against the evals project (model calls and cloud
      # evaluations); the hosted agent in the coach project is not involved.
      - name: Golden set (Coach ${{ matrix.version }})
        env:
          COACH_PROMPT_VERSION: ${{ matrix.version }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_EVALS_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.4' }}
        run: dotnet test tests/Swankers.Evals --no-build -c Release --logger "console;verbosity=normal"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-${{ matrix.version }}
          path: artifacts/evals/
          if-no-files-found: warn

  promote:
    needs: evals
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.promote }}
    # `inputs` is not available when rendering job names, so the version is logged in the steps.
    name: promote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: foundry
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the version's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evals-${{ inputs.promote_version }}
          path: artifacts/evals/

      - name: Gate on the report
        env:
          VERSION: ${{ inputs.promote_version }}
        run: |
          report="artifacts/evals/latest-$VERSION.json"
          test -f "$report" || { echo "no report for $VERSION"; exit 1; }
          jq -e '.passed == true' "$report" > /dev/null || { echo "evals for $VERSION did not pass:"; jq '.gateFailures' "$report"; exit 1; }
          echo "evals for $VERSION passed"

      - name: Set up .NET (SDK from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # AZURE_DEPLOY_CLIENT_ID is an environment secret: it exists only for jobs that passed
      # the foundry environment's required review, and its federated credential matches only
      # this environment's OIDC subject.
      - name: Azure login (OIDC, deploy identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore (locked)
        run: dotnet restore SwankersCoach.slnx --locked-mode

      # --no-restore: the locked restore above is the only restore this job may do. The implicit
      # restore inside `dotnet run` failed on the runner with MSB4181 ("RestoreTask returned false
      # but did not log an error", run 36515480007) and would not be locked anyway.
      - name: Deploy and route the hosted agent version
        env:
          VERSION: ${{ inputs.promote_version }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          MCP_ENDPOINT: ${{ vars.MCP_ENDPOINT }}
          KEYVAULT_URI: ${{ vars.KEYVAULT_URI }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.4' }}
        run: >
          dotnet run --no-restore --project tools/Swankers.AgentDeploy -c Release --
          create --label "$VERSION-owner" --prompt "$VERSION" --credential-key Mcp:OwnerCredential --route
