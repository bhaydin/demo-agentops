name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; the tag is in the trailing comment.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (SDK from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore SwankersCoach.slnx --locked-mode

      - name: Build
        run: dotnet build SwankersCoach.slnx --no-restore -c Release

      # Swankers.Evals' model-backed gate skips itself without FOUNDRY_PROJECT_ENDPOINT and
      # runs in evals.yml; its evaluator and golden-set unit tests run here.
      - name: Test (League)
        run: dotnet test tests/Swankers.League.Tests --no-build -c Release

      - name: Test (Mcp)
        run: dotnet test tests/Swankers.Mcp.Tests --no-build -c Release

      - name: Test (Coach)
        run: dotnet test tests/Swankers.Coach.Tests --no-build -c Release

      - name: Test (AgentDeploy)
        run: dotnet test tests/Swankers.AgentDeploy.Tests --no-build -c Release

      - name: Test (Evals, model-free)
        run: dotnet test tests/Swankers.Evals --no-build -c Release
