# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# azd environment for the two Container Apps services. Images are built remotely in the
# environment's Container Registry (no local Docker). The Coach hosted agent is not an azd
# service: tools/Swankers.AgentDeploy publishes it to the shared Foundry project so versions
# and routing stay under demo control (Thursday's rollback). See README.md, "Deploy to Azure".
name: swankers-coach
metadata:
  template: swankers-coach@0.4.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  mcp:
    project: src/Swankers.Mcp
    language: csharp
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
  web:
    project: src/Swankers.Web
    language: csharp
    host: containerapp
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
